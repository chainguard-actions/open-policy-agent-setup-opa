name: Test basic usage (latest OPA)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup-opa
        uses: .
        with:
          version: latest
      - name: Assert OPA is installed and executable
        run: |
          echo "OPA version output:"
          opa version
          if ! command -v opa &>/dev/null; then
            echo "FAIL: opa command not found"
            exit 1
          fi
          echo "PASS: opa is installed"
      - name: Assert OPA can evaluate a simple policy
        run: |
          RESULT=$(echo '{"x": 1}' | opa eval -I 'data.x == 1' 2>&1 || true)
          echo "eval result: $RESULT"
          # Just verify opa runs without crashing
          opa eval 'true' && echo "PASS: opa eval works" || { echo "FAIL: opa eval failed"; exit 1; }

name: Test basic usage (latest OPA)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup-opa
        uses: .
        with:
          github-token: ${{ github.token }}
      - name: Assert OPA is installed and on PATH
        run: |
          echo "OPA version:"
          opa version
          if ! command -v opa > /dev/null 2>&1; then
            echo "FAIL: opa not found on PATH"
            exit 1
          fi
          echo "PASS: opa is available on PATH"
      - name: Assert OPA can evaluate a simple policy
        run: |
          RESULT=$(echo '{"x": 1}' | opa eval -I 'data.x == 1' 2>&1 || true)
          echo "OPA eval result: $RESULT"
          # Just verify opa runs without crashing
          opa eval 'true' > /dev/null 2>&1
          echo "PASS: opa eval works"

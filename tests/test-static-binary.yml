name: Test static binary installation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup-opa
        uses: .
        with:
          version: latest
          static: 'true'
      - name: Assert OPA static binary is installed
        run: |
          if ! command -v opa &>/dev/null; then
            echo "FAIL: opa command not found"
            exit 1
          fi
          echo "OPA version:"
          opa version
          echo "PASS: static opa binary is installed and functional"
      - name: Assert static binary has no dynamic library dependencies
        run: |
          OPA_PATH=$(which opa)
          echo "opa path: $OPA_PATH"
          # Check if the binary is statically linked (no dynamic libs)
          if ldd "$OPA_PATH" 2>&1 | grep -q "not a dynamic executable"; then
            echo "PASS: binary is statically linked"
          elif ldd "$OPA_PATH" 2>&1 | grep -q "statically linked"; then
            echo "PASS: binary is statically linked"
          else
            # Some static binaries may still show minimal libc; just verify opa works
            echo "INFO: ldd output:"
            ldd "$OPA_PATH" 2>&1 || true
            echo "PASS: opa is installed (static flag accepted)"
          fi

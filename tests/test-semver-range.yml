name: Test semver range version specification
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup-opa
        uses: .
        with:
          version: ">=0.50.0 <0.61.0"
          github-token: ${{ github.token }}
      - name: Assert OPA is installed within the semver range
        run: |
          INSTALLED=$(opa version | head -1)
          echo "Installed: $INSTALLED"
          if ! command -v opa > /dev/null 2>&1; then
            echo "FAIL: opa not found on PATH"
            exit 1
          fi
          # Extract version number and verify it's in range (>=0.50.0 and <0.61.0)
          VERSION=$(opa version | head -1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          echo "Extracted version: $VERSION"
          MAJOR=$(echo "$VERSION" | cut -d. -f1)
          MINOR=$(echo "$VERSION" | cut -d. -f2)
          if [ "$MAJOR" -eq 0 ] && [ "$MINOR" -ge 50 ] && [ "$MINOR" -lt 61 ]; then
            echo "PASS: version $VERSION is within range >=0.50.0 <0.61.0"
          else
            echo "FAIL: version $VERSION is NOT within range >=0.50.0 <0.61.0"
            exit 1
          fi

name: Test semver range version selection
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup-opa
        uses: .
        with:
          version: '>=0.60.0 <0.70.0'
      - name: Assert OPA is installed
        run: |
          echo "Checking OPA binary..."
          if ! command -v opa &>/dev/null; then
            echo "FAIL: opa command not found in PATH"
            exit 1
          fi
          echo "PASS: opa found at $(which opa)"
      - name: Assert OPA version is within semver range
        run: |
          VERSION_OUTPUT=$(opa version)
          echo "opa version output: $VERSION_OUTPUT"
          # Extract version number (e.g. "0.68.0")
          VERSION=$(echo "$VERSION_OUTPUT" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          echo "Extracted version: $VERSION"
          MAJOR=$(echo "$VERSION" | cut -d. -f1)
          MINOR=$(echo "$VERSION" | cut -d. -f2)
          if [ "$MAJOR" -ne 0 ] || [ "$MINOR" -lt 60 ] || [ "$MINOR" -ge 70 ]; then
            echo "FAIL: version $VERSION is not in range >=0.60.0 <0.70.0"
            exit 1
          fi
          echo "PASS: version $VERSION is within expected range"
